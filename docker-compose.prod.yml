# RouteCare AI - Production compose file.
#
# Standalone (not an overlay of docker-compose.yml) on purpose: Compose
# merges list-valued keys like `volumes` across `-f base -f override`
# layers rather than replacing them, so trying to "unset" the dev
# bind-mounts via an override file is unreliable across Compose
# versions. A separate, fully self-contained prod file has no such
# ambiguity and is easy to audit on its own - see
# docs/14_Production_Deployment.md for the full deployment/runbook.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Every image here is built from each service's Dockerfile.prod (non-root,
# healthchecked, no dev bind-mounts, no --reload/`next dev`) - see those
# files' own comments for why they differ from the dev Dockerfiles.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routecare-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port published - only reachable from other containers on this compose network.
    # Expose POSTGRES_PORT here (uncomment) only if an external tool genuinely needs direct access.
    # ports:
    #   - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7-alpine
    container_name: routecare-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: routecare-backend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: routecare-worker-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: routecare-frontend-prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
